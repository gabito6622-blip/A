<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Recuperar contraseña</title>
<style>
:root{--bg:#090e1d;--card:#101a30;--line:#283655;--ink:#eef5ff;--muted:#9caccc;--acc:#3984ff;--ok:#4ad68c;--bad:#ff8787}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fc;--card:#fff;--line:#dfe5ef;--ink:#111827;--muted:#4b5567;--acc:#1e5be0;--ok:#0f8a4f;--bad:#c92a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:40px 16px 60px;display:grid;gap:16px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);width:100%}
input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
button,.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;text-align:center;display:block}
button:disabled{opacity:.6;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.err{color:var(--bad);font-weight:600;margin:0;min-height:1.2em}
.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}
.who{font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<main id="app"><p class="muted">Cargando…</p></main>
<script type="module" src="/recuperar.js"></script>
</body>
</html>
