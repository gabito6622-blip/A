<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Recuperar contraseña</title>
<style>
:root{--bg:#090e1d;--card:#101a30;--line:#283655;--ink:#eef5ff;--muted:#9caccc;--acc:#3984ff;--ok:#4ad68c;--bad:#ff8787}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fc;--card:#fff;--line:#dfe5ef;--ink:#111827;--muted:#4b5567;--acc:#1e5be0;--ok:#0f8a4f;--bad:#c92a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:40px 16px 60px;display:grid;gap:16px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);width:100%}
input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
button,.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;text-align:center;display:block}
button:disabled{opacity:.6;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.err{color:var(--bad);font-weight:600;margin:0;min-height:1.2em}
.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}
.who{font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<main id="app"><p class="muted">Cargando…</p></main>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const token = new URLSearchParams(location.search).get("t") || "";

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || "Algo salió mal"), { status: r.status, code: j.code });
  return j;
}

function fail(msg) {
  $("#app").innerHTML = `<div class="card"><h1>Enlace no válido</h1><p class="muted">${esc(msg)}</p><a class="btn" href="/">Ir a la tienda</a></div>`;
}

function done(email) {
  $("#app").innerHTML = `<div class="card"><h1>¡Listo! 🎉</h1><div class="ok">Ya cambiaste tu contraseña${email ? ` de <b>${esc(email)}</b>` : ""}.</div><p class="muted">Ya entraste. Volvé a la tienda para comprar y ver tus cuentas.</p><a class="btn" href="/">Entrar a la tienda</a></div>`;
}

function form(info) {
  $("#app").innerHTML = `<div><h1>Nueva contraseña</h1><p class="muted">Hola <span class="who">${esc((info.name || "").split(" ")[0] || "")}</span>, elegí una contraseña nueva para <b>${esc(info.email)}</b>.</p></div>
    <form class="card" id="f">
      <label>Contraseña nueva (mínimo 8)<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••"></label>
      <label>Repetir contraseña<input name="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••"></label>
      <p class="err" id="e"></p>
      <button type="submit">Guardar contraseña</button>
    </form>`;
  $("#f input")?.focus();
  $("#f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    if (f.password.value !== f.confirm.value) return ($("#e").textContent = "Las dos contraseñas no coinciden");
    if (f.password.value.length < 8) return ($("#e").textContent = "Necesita al menos 8 caracteres");
    const btn = f.querySelector("button");
    btn.disabled = true;
    try { await api("POST", "/api/auth/customer/reset", { token, password: f.password.value }); done(info.email); }
    catch (e) { btn.disabled = false; $("#e").textContent = e.message; }
  });
}

(async () => {
  if (!token) return fail("El enlace está incompleto. Pedí uno nuevo desde «Olvidé mi contraseña».");
  try {
    const info = await api("GET", `/api/auth/customer/reset/${encodeURIComponent(token)}`);
    form(info);
  } catch (e) {
    fail(e.message || "El enlace venció o ya se usó. Pedí uno nuevo.");
  }
})();
</script>
</body>
</html>
