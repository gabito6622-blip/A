<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Códigos de acceso</title>
<style>
:root{--bg:#090e1d;--card:#101a30;--line:#283655;--ink:#eef5ff;--muted:#9caccc;--acc:#3984ff;--ok:#4ad68c;--bad:#ff8787}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fc;--card:#fff;--line:#dfe5ef;--ink:#111827;--muted:#4b5567;--acc:#1e5be0;--ok:#0f8a4f;--bad:#c92a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 16px 60px;display:grid;gap:16px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:56px;height:64px;text-align:center;font-size:28px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pin input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
button,.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.err{color:var(--bad);font-weight:600;text-align:center;margin:0;min-height:1.5em}
.code{display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;padding:14px}
.code .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.code small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.code b.v{font-size:30px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.empty{text-align:center;color:var(--muted);padding:18px 6px}
</style>
</head>
<body>
<main id="app"><p class="muted">Cargando…</p></main>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const token = location.pathname.split("/").filter(Boolean)[1];
const KEY = "gh-pin-" + token;
let pin = null, name = "", timer = null, q = "", last = [], minutes = 30;

async function call(method, body) {
  const r = await fetch(`/api/code-link/${encodeURIComponent(token)}`, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || "Error"), { status: r.status });
  return j;
}

function askPin(msg = "") {
  clearInterval(timer);
  $("#app").innerHTML = `<div><h1>🔐 ${esc(name)}</h1><p class="muted">Códigos de acceso de Disney+. Escribí el PIN de 4 números.</p></div>
    <form class="card" id="f"><div class="pin">${[0, 1, 2, 3].map((i) => `<input inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" aria-label="Número ${i + 1} del PIN" data-i="${i}">`).join("")}</div>
    <p class="err" id="e">${esc(msg)}</p><button type="submit">Ver mis códigos</button></form>`;
  const ins = [...document.querySelectorAll(".pin input")];
  ins[0].focus();
  ins.forEach((el, i) => {
    el.addEventListener("input", () => { el.value = el.value.replace(/\D/g, "").slice(-1); if (el.value && i < 3) ins[i + 1].focus(); if (ins.every((x) => x.value)) $("#f").requestSubmit(); });
    el.addEventListener("keydown", (ev) => { if (ev.key === "Backspace" && !el.value && i) ins[i - 1].focus(); });
    el.addEventListener("paste", (ev) => { const t = (ev.clipboardData?.getData("text") ?? "").replace(/\D/g, "").slice(0, 4); if (t.length === 4) { ev.preventDefault(); t.split("").forEach((d, k) => (ins[k].value = d)); $("#f").requestSubmit(); } });
  });
  $("#f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const p = ins.map((x) => x.value).join("");
    if (!/^\d{4}$/.test(p)) return ($("#e").textContent = "Completá los 4 números");
    try { await load(p); pin = p; try { sessionStorage.setItem(KEY, p); } catch { /* */ } }
    catch (e) { ins.forEach((x) => (x.value = "")); ins[0].focus(); $("#e").textContent = e.message; }
  });
}

function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  return s < 60 ? "recién" : `hace ${Math.round(s / 60)} min`;
}

function show(data) {
  last = data.codes; minutes = data.minutes ?? minutes;
  const list = last.filter((c) => !q || c.to.includes(q.toLowerCase()));
  const keep = document.activeElement?.id === "q";
  $("#app").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>${esc(data.name)}</h1><span class="live"><i></i>Se actualiza solo</span></div>
    <p class="muted">Acá aparecen los códigos de Disney+ / MyDisney de tus cuentas. Cada uno dura ${data.minutes} minutos.</p>
    ${last.length > 3 ? `<input class="search" id="q" placeholder="Buscar por correo de la cuenta" value="${esc(q)}" inputmode="email">` : ""}
    <div class="card">${list.length ? list.map((c) => `<div class="code"><div class="top"><small>${esc(c.to)}${c.product ? ` · ${esc(c.product)}` : ""}</small><small>${ago(c.receivedAt)}</small></div>
      ${c.code ? `<b class="v">${esc(c.code)}</b>` : ""}<small>${esc(c.subject)}</small>
      <div class="row">${c.code ? `<button type="button" data-copy="${esc(c.code.replace(/\D/g, ""))}">Copiar código</button>` : ""}${c.link ? `<a class="btn ghost" href="${esc(c.link)}" target="_blank" rel="noopener noreferrer">Abrir enlace</a>` : ""}</div></div>`).join("")
      : `<div class="empty">📭 No hay códigos nuevos.<br>Pedí el código en Disney+ y esperá unos segundos: aparece solo acá.</div>`}</div>
    <button class="ghost" type="button" id="out">Salir</button>`;
  if (keep) { const f = $("#q"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}

async function load(p) {
  const data = await call("POST", { pin: p });
  show(data);
  clearInterval(timer);
  timer = setInterval(async () => {
    if (document.hidden) return;
    try { show(await call("POST", { pin })); } catch (e) { if (e.status === 401) { try { sessionStorage.removeItem(KEY); } catch { /* */ } askPin("El PIN cambió. Escribilo de nuevo."); } }
  }, 10_000);
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.copy) { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "¡Copiado! ✓"; } catch { b.textContent = b.dataset.copy; } setTimeout(() => (b.textContent = "Copiar código"), 1500); }
  if (b.id === "out") { try { sessionStorage.removeItem(KEY); } catch { /* */ } pin = null; askPin(); }
});
document.addEventListener("input", (ev) => { if (ev.target.id === "q") { q = ev.target.value.trim(); show({ name, codes: last, minutes }); } });

(async () => {
  try { name = (await call("GET")).name; } catch (e) { $("#app").innerHTML = `<div class="card"><h1>Link no válido</h1><p class="muted">${esc(e.message)}. Pedile el link nuevo a tu proveedor.</p></div>`; return; }
  document.title = `Códigos · ${name}`;
  let saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch { /* */ }
  if (saved) { try { await load(saved); pin = saved; return; } catch { /* pedir de nuevo */ } }
  askPin();
})();
</script>
</body>
</html>
