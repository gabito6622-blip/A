<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Códigos de acceso</title>
<style>
:root{--bg:#090e1d;--card:#101a30;--line:#283655;--ink:#eef5ff;--muted:#9caccc;--acc:#3984ff;--ok:#4ad68c;--bad:#ff8787}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fc;--card:#fff;--line:#dfe5ef;--ink:#111827;--muted:#4b5567;--acc:#1e5be0;--ok:#0f8a4f;--bad:#c92a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 16px 60px;display:grid;gap:16px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:56px;height:64px;text-align:center;font-size:28px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pin input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
button,.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.err{color:var(--bad);font-weight:600;text-align:center;margin:0;min-height:1.5em}
.code{display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;padding:14px}
.code .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ktag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.ktag.k-hogar{background:color-mix(in srgb,#8b5cf6 20%,transparent);color:#a78bfa}
.ktag.k-temporal{background:color-mix(in srgb,#f59e0b 20%,transparent);color:#fbbf24}
.ktag.k-verificacion{background:color-mix(in srgb,#10b981 20%,transparent);color:#34d399}
.ksub{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.code small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.code b.v{font-size:30px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.empty{text-align:center;color:var(--muted);padding:18px 6px}
</style>
</head>
<body>
<main id="app"><p class="muted">Cargando…</p></main>
<script type="module" src="/codigos.js"></script>
</body>
</html>
