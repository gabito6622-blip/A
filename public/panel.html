<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Gabriel Store</title>
<link rel="manifest" href="/panel.webmanifest">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabriel Panel">
<link rel="apple-touch-icon" href="/panel-icon-192.png">
<link rel="icon" href="/panel-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" media="print" data-font="1">
<link rel="stylesheet" href="/tema.css">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/panel.css">
<link rel="stylesheet" href="/inventario.css">
<link rel="stylesheet" href="/plata.css">
<link rel="stylesheet" href="/caidas.css">
<link rel="stylesheet" href="/perfil.css">
<style>body{background:#070b16}</style><!-- oscuro desde el primer cuadro: es el tema por defecto del panel (sin destello claro/azul) -->
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <div style="display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px"><span style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3984ff,#6cc8ff);display:grid;place-items:center;color:#fff">G</span>Panel de la tienda</div>
    <div id="loginErr" class="perr" hidden></div>
    <label>Usuario<input name="username" required autocomplete="username" autocapitalize="none"></label>
    <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
    <a href="/tienda/" style="font-size:13px;color:#5f6b7d">← Ir a la tienda</a>
  </form>
</div>

<div class="app" id="app" hidden>
  <div class="sscrim" id="sscrim"></div>
  <aside class="side" id="side">
    <div class="plogo"><i>G</i><span id="pStore" style="color:inherit;font-weight:700">Gabriel Store</span></div>
    <div class="profile"><div class="avatar"><svg class="i"><use href="/icons.svg#i-user"/></svg></div><b id="pName"></b><div class="role" id="pRole"></div></div>
    <input class="menufind" id="menuFind" type="search" placeholder="🔎 Buscar pantalla…" aria-label="Buscar pantalla" autocomplete="off">
    <nav class="menu" id="menu" aria-label="Panel"></nav>
    <div class="themes" role="group" aria-label="Tema del panel">
      <button type="button" data-th="light"><svg class="i"><use href="/icons.svg#i-sun"/></svg>Claro</button>
      <button type="button" data-th="dark"><svg class="i"><use href="/icons.svg#i-moon"/></svg>Oscuro</button>
      <button type="button" data-th="system"><svg class="i"><use href="/icons.svg#i-monitor"/></svg>Sistema</button>
    </div>
    <a class="pbtn" href="/tienda/" target="_blank" rel="noopener" style="justify-content:center"><svg class="i"><use href="/icons.svg#i-ext"/></svg>Ver mi tienda</a>
    <button class="logout" type="button" data-logout="1"><svg class="i"><use href="/icons.svg#i-logout"/></svg>Cerrar sesión</button>
    <a class="swnote" href="/terminos#software" target="_blank" rel="noopener">© 2026 GaboHub · software protegido (Ley 1322)</a>
  </aside>
  <main class="pmain">
    <div class="ptop">
      <button class="ibtn burger" type="button" id="burger" aria-label="Abrir menú"><svg class="i"><use href="/icons.svg#i-menu"/></svg></button>
      <h1 id="ptitle"></h1>
      <span class="date" id="clock"></span>
      <button class="ibtn ibl" type="button" data-gsopen="1" aria-label="Buscar (tecla /)" title="Buscar (tecla /)"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-search"/></svg><span class="ibt" aria-hidden="true">Buscar</span></button>
      <button class="ibtn ibl" type="button" data-hidemoney="1" aria-label="Tapar montos" aria-pressed="false"><span class="mnyico" aria-hidden="true">👁️</span><span class="ibt" aria-hidden="true">Montos</span></button>
      <button class="ibtn ibl" type="button" data-go="aprobacion" aria-label="Pagos por revisar" title="Pagos por revisar"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-idcard"/></svg><span class="ibt" aria-hidden="true">Pagos</span><span class="dot" id="dot" hidden></span></button>
      <button class="ibtn ibl" type="button" data-go="notificaciones" aria-label="Notificaciones" title="Notificaciones"><svg class="i" aria-hidden="true"><use href="/icons.svg#i-bell"/></svg><span class="ibt" aria-hidden="true">Avisos</span><span class="count" id="notifcount" hidden></span></button>
    </div>
    <div id="pout" style="display:grid;gap:22px;min-width:0"></div>
  </main>
  <nav class="pbnav" id="pbnav" aria-label="Accesos rápidos">
    <button type="button" data-go="inicio"><svg class="i"><use href="/icons.svg#i-home"/></svg><span>Inicio</span></button>
    <button type="button" data-go="clientes"><svg class="i"><use href="/icons.svg#i-users"/></svg><span>Clientes</span></button>
    <button type="button" data-go="vender" class="pbnav-mid"><svg class="i"><use href="/icons.svg#i-cart"/></svg><span>Vender</span></button>
    <button type="button" data-go="cuentas"><svg class="i"><use href="/icons.svg#i-box"/></svg><span>Inventario</span></button>
    <button type="button" data-more="1" aria-label="Más: todo el menú"><svg class="i"><use href="/icons.svg#i-menu"/></svg><span>Más</span></button>
  </nav>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="/panel.js" type="module"></script>
</body>
</html>
