<title>Tienda Pantalla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera fija de tienda → filtros → grilla de productos → carrito lateral con pedido por WhatsApp */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14202e; --muted:#5b6878; --line:#dde3ea;
  --accent:#0b7a6f; --accent-ink:#ffffff; --accent-soft:#d9f0ec; --warn:#b4540a; --warn-soft:#fdebd8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --surface:#17222e; --ink:#e7edf3; --muted:#9aa8b6; --line:#273545;
  --accent:#3cc2b2; --accent-ink:#06201d; --accent-soft:#163a37; --warn:#f0a35c; --warn-soft:#3a2614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17222e; --ink:#e7edf3; --muted:#9aa8b6; --line:#273545;
  --accent:#3cc2b2; --accent-ink:#06201d; --accent-soft:#163a37; --warn:#f0a35c; --warn-soft:#3a2614; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font:800 22px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:20px;border-radius:5px;background:var(--accent);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;left:11px;top:5px;border:5px solid transparent;border-left:7px solid var(--accent-ink);border-right:0}
.open{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
.open b{width:8px;height:8px;border-radius:50%;background:#2fa36b}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cartbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.cartbtn span{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;padding:0 6px;font-size:12px;line-height:22px;text-align:center}
.intro{padding-block:28px 8px;display:grid;gap:6px}
.intro h1{font:800 clamp(26px,4vw,38px)/1.1 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.demo-note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;justify-self:start}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding-block:16px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{margin-left:auto;flex:1 1 200px;max-width:280px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-block:4px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.badge{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font:800 18px var(--display);color:#fff;flex:none}
.top h3{margin:0;font:600 17px/1.2 var(--display)}
.top small{color:var(--muted)}
.feat{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:grid;gap:2px}
.feat li::before{content:"✓ ";color:var(--accent);font-weight:700}
.plans{display:flex;gap:6px;flex-wrap:wrap;align-self:start}
.plans button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px}
.plans button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.buy{display:flex;align-items:end;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.price{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.price small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:4px}
.stock{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.stock.low{background:var(--warn-soft);color:var(--warn)}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.add:disabled{opacity:.45;cursor:not-allowed}
.empty{color:var(--muted);padding:24px 0}
/* carrito */
.scrim{position:fixed;inset:0;background:rgba(5,10,16,.45);z-index:20}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;gap:12px}
aside h2{margin:0;font:800 20px var(--display);display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1}
.lines{overflow:auto;display:grid;gap:10px;align-content:start;flex:1}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.line .n{font-weight:600}
.line .m{color:var(--muted);font-size:13px}
.qty{display:flex;gap:6px;align-items:center;grid-row:span 2;font-variant-numeric:tabular-nums}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.total{display:flex;justify-content:space-between;font:800 18px var(--display);font-variant-numeric:tabular-nums}
form{display:grid;gap:8px}
label{font-size:13px;color:var(--muted);display:grid;gap:4px}
form input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 10px;font:inherit}
.send{background:#1f9d55;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:600}
.msg{display:grid;gap:8px;font-size:13px}
.msg pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:180px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row a,.row button{flex:1;text-align:center;border-radius:8px;padding:9px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row a{background:#1f9d55;color:#fff;border-color:#1f9d55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30}
@media (prefers-reduced-motion:no-preference){aside{animation:in .2s ease-out}@keyframes in{from{transform:translateX(30px);opacity:.6}}}
</style>

<header><div class="wrap">
  <div class="logo"><i></i>Pantalla</div>
  <div class="open"><b></b>Entrega en 5–15 min</div>
  <button class="cartbtn" id="openCart" type="button">Carrito <span id="count">0</span></button>
</div></header>

<main class="wrap">
  <section class="intro">
    <span class="demo-note">Demo con productos y precios de ejemplo</span>
    <h1>Perfiles y cuentas de streaming, listos hoy</h1>
    <p>Elegí el servicio y la duración, armá tu pedido y envialo por WhatsApp. Te mandamos los accesos al confirmar el pago.</p>
  </section>
  <div class="tools" role="toolbar" aria-label="Filtrar">
    <div id="cats" class="row" style="flex:0 1 auto"></div>
    <input class="search" id="q" type="search" placeholder="Buscar servicio…" aria-label="Buscar servicio">
  </div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside id="cart" hidden aria-label="Carrito">
  <h2>Tu pedido <button class="x" id="closeCart" type="button" aria-label="Cerrar">×</button></h2>
  <div class="lines" id="lines"></div>
  <div class="total"><span>Total</span><span id="total">$0</span></div>
  <form id="order">
    <label for="name">Nombre<input id="name" required autocomplete="name" value="Lucía G."></label>
    <label for="phone">Tu WhatsApp<input id="phone" required inputmode="tel" value="+54 9 11 5555 0101"></label>
    <label for="pay">Medio de pago<input id="pay" value="Transferencia"></label>
    <button class="send" type="submit">Generar pedido para WhatsApp</button>
  </form>
  <div class="msg" id="msg" hidden>
    <pre id="msgText"></pre>
    <div class="row"><button type="button" id="copy">Copiar mensaje</button><a id="wa" target="_blank" rel="noopener">Abrir WhatsApp</a></div>
    <span style="color:var(--muted)">Número de la tienda: <b id="shopNum"></b></span>
  </div>
</aside>
<div class="toast" id="toast" hidden></div>

<script>
// ===== Configurá tu tienda acá =====
const TIENDA = {
  nombre: "Pantalla",
  whatsapp: "5491100000000",   // tu número, solo dígitos con código de país
  moneda: "ARS",
};
// Catálogo de ejemplo: cambiá servicios, planes, precios y stock.
const PRODUCTOS = [
  {id:"nf",  nombre:"Netflix",       cat:"Video",  color:"#c4161c", desc:"Perfil privado", feat:["1 pantalla","Calidad HD"], stock:12, planes:[[1,4500],[3,12500],[6,23000]]},
  {id:"dp",  nombre:"Disney+",       cat:"Video",  color:"#1a3c8f", desc:"Perfil privado", feat:["1 pantalla","Incluye Star"], stock:8,  planes:[[1,3200],[3,8900]]},
  {id:"mx",  nombre:"Max",           cat:"Video",  color:"#4b2bd6", desc:"Perfil privado", feat:["1 pantalla","Series y cine"], stock:3,  planes:[[1,3000],[3,8400]]},
  {id:"pv",  nombre:"Prime Video",   cat:"Video",  color:"#0f79af", desc:"Perfil privado", feat:["1 pantalla","Full HD"], stock:15, planes:[[1,2500],[3,6900]]},
  {id:"sp",  nombre:"Spotify",       cat:"Música", color:"#1d8f4c", desc:"Cuenta individual", feat:["Sin anuncios","Descargas offline"], stock:20, planes:[[1,2800],[3,7800],[12,29000]]},
  {id:"yt",  nombre:"YouTube Premium",cat:"Música",color:"#b31217", desc:"Invitación familiar", feat:["Sin anuncios","Incluye Music"], stock:0, planes:[[1,3100]]},
  {id:"c1",  nombre:"Combo Cine",    cat:"Combos", color:"#7a4b12", desc:"Netflix + Disney+ + Max", feat:["3 perfiles","Ahorrás 15%"], stock:5, planes:[[1,9100],[3,25500]]},
  {id:"c2",  nombre:"Combo Total",   cat:"Combos", color:"#0b7a6f", desc:"Video + Spotify", feat:["4 servicios","Ahorrás 20%"], stock:2, planes:[[1,10800]]},
];
// ===================================

const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:TIENDA.moneda,maximumFractionDigits:0}).format(n);
const meses = m => m === 1 ? "1 mes" : m + " meses";
const cart = [];           // {id, meses, precio, qty}
const sel = {};            // plan elegido por producto
let cat = "Todo", q = "";

function renderCats(){
  const cats = ["Todo", ...new Set(PRODUCTOS.map(p=>p.cat))];
  $("#cats").innerHTML = cats.map(c=>`<button type="button" class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
}
function renderGrid(){
  const list = PRODUCTOS.filter(p => (cat==="Todo"||p.cat===cat) && (p.nombre+p.desc).toLowerCase().includes(q));
  $("#grid").innerHTML = list.length ? list.map(p=>{
    const i = sel[p.id] ?? 0, [m,precio] = p.planes[i];
    const st = p.stock===0 ? `<span class="stock low">Agotado</span>` : p.stock<=3 ? `<span class="stock low">Quedan ${p.stock}</span>` : `<span class="stock">Disponible</span>`;
    return `<article class="card">
      <div class="top"><div class="badge" style="background:${p.color}">${p.nombre[0]}</div>
        <div><h3>${p.nombre}</h3><small>${p.desc}</small></div></div>
      <ul class="feat">${p.feat.map(f=>`<li>${f}</li>`).join("")}</ul>
      <div class="plans">${p.planes.map(([mm],j)=>`<button type="button" aria-pressed="${j===i}" data-p="${p.id}" data-i="${j}">${meses(mm)}</button>`).join("")}</div>
      <div class="buy"><div class="price">${fmt(precio)}<small>${st}</small></div>
        <button type="button" class="add" data-add="${p.id}" ${p.stock===0?"disabled":""}>Agregar</button></div>
    </article>`}).join("") : `<p class="empty">No hay servicios que coincidan con “${q}”.</p>`;
}
function renderCart(){
  const total = cart.reduce((s,l)=>s+l.precio*l.qty,0);
  $("#count").textContent = cart.reduce((s,l)=>s+l.qty,0);
  $("#total").textContent = fmt(total);
  $("#lines").innerHTML = cart.length ? cart.map((l,k)=>{
    const p = PRODUCTOS.find(x=>x.id===l.id);
    return `<div class="line"><span class="n">${p.nombre}</span>
      <div class="qty"><button type="button" data-d="${k}" aria-label="Quitar uno">−</button>${l.qty}<button type="button" data-u="${k}" aria-label="Agregar uno">+</button></div>
      <span class="m">${meses(l.meses)} · ${fmt(l.precio*l.qty)}</span></div>`}).join("")
    : `<p class="empty">Tu carrito está vacío. Agregá un servicio para armar el pedido.</p>`;
  $("#order").hidden = !cart.length;
  if(!cart.length) $("#msg").hidden = true;
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
function openCart(v){$("#cart").hidden=!v;$("#scrim").hidden=!v}

document.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.c){cat=b.dataset.c;renderCats();renderGrid()}
  else if(b.dataset.p){sel[b.dataset.p]=+b.dataset.i;renderGrid()}
  else if(b.dataset.add){
    const p = PRODUCTOS.find(x=>x.id===b.dataset.add), [m,precio]=p.planes[sel[p.id]??0];
    const ex = cart.find(l=>l.id===p.id&&l.meses===m);
    ex ? ex.qty++ : cart.push({id:p.id,meses:m,precio,qty:1});
    renderCart(); toast(`${p.nombre} · ${meses(m)} agregado`);
  }
  else if(b.dataset.u){cart[b.dataset.u].qty++;renderCart()}
  else if(b.dataset.d){const l=cart[b.dataset.d];if(--l.qty<=0)cart.splice(b.dataset.d,1);renderCart()}
});
$("#q").addEventListener("input",e=>{q=e.target.value.toLowerCase().trim();renderGrid()});
$("#openCart").onclick=()=>openCart(true);
$("#closeCart").onclick=$("#scrim").onclick=()=>openCart(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")openCart(false)});

$("#order").addEventListener("submit",e=>{
  e.preventDefault();
  const total = cart.reduce((s,l)=>s+l.precio*l.qty,0);
  const txt = [`Hola ${TIENDA.nombre}, quiero hacer este pedido:`, "",
    ...cart.map(l=>`• ${l.qty} × ${PRODUCTOS.find(p=>p.id===l.id).nombre} (${meses(l.meses)}) — ${fmt(l.precio*l.qty)}`),
    "", `Total: ${fmt(total)}`, `Nombre: ${$("#name").value}`, `WhatsApp: ${$("#phone").value}`, `Pago: ${$("#pay").value}`].join("\n");
  $("#msgText").textContent = txt;
  $("#wa").href = `https://wa.me/${TIENDA.whatsapp}?text=${encodeURIComponent(txt)}`;
  $("#shopNum").textContent = "+" + TIENDA.whatsapp;
  $("#msg").hidden = false;
});
$("#copy").addEventListener("click",()=>{
  const t=$("#msgText").textContent;
  navigator.clipboard.writeText(t).then(()=>toast("Mensaje copiado"),()=>{
    const r=document.createRange();r.selectNodeContents($("#msgText"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Seleccionado: copialo con Ctrl+C");
  });
});

// Estado inicial de ejemplo para que la demo muestre el carrito funcionando
cart.push({id:"nf",meses:1,precio:4500,qty:1},{id:"sp",meses:3,precio:7800,qty:1});
renderCats(); renderGrid(); renderCart();
</script>
