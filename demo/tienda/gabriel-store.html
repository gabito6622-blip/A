<title>Gabriel Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: diseño oscuro único. Panel = menú lateral + contenido; Tienda = barra superior + catálogo y "Mis cuentas". En celular el menú lateral se vuelve desplegable. */
:root{
  --bg:#0b1220; --side:#0e1627; --surface:#141e31; --raised:#1b2740; --line:#26334d;
  --ink:#e8eef8; --muted:#8e9bb3; --accent:#3d8bfd; --accent-ink:#ffffff;
  --ok:#3fd18b; --ok-soft:#123827; --warn:#f2b84b; --warn-soft:#3a2c10; --bad:#f2716b; --bad-soft:#3b1a1c; --wa:#25a95d; --wa-bubble:#0f3b2c;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
/* botones y pills */
.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.light{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--raised);display:inline-grid;place-items:center;padding:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--raised);color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.box h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box h2 small{font-weight:500;color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select,.filters input,label input,label select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.filters>*{flex:1 1 170px}
.filters .btn{flex:0 0 auto}
label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:13px;font-weight:700;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--raised)}
.plat{display:flex;gap:8px;align-items:center}
.plogo{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}

/* ============ PANEL ============ */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.blogo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 6px}
.blogo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7a5cff);display:grid;place-items:center;font-style:normal;color:#fff}
.blogo span{font-weight:500;color:var(--muted)}
.who{display:grid;justify-items:center;gap:6px;padding:12px 0;border-block:1px solid var(--line)}
.who .av{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:22px}
.who b{background:var(--raised);border-radius:8px;padding:5px 0;width:100%;text-align:center;letter-spacing:.08em;font-size:13px}
.menu{display:grid;gap:6px}
.menu button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:none;border-radius:9px;padding:9px 12px;text-align:left;font-weight:600;color:var(--muted)}
.menu button[aria-current="page"]{background:var(--raised);color:var(--ink);border-color:var(--accent)}
.menu .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.menu svg{width:16px;height:16px;flex:none}
.side .switch{margin-top:auto}
.main{min-width:0;padding-block:20px 50px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;margin-right:auto}
.top .date{font-style:italic;color:var(--muted);font-size:13px}
.burger{display:none}
.note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;justify-self:start}
/* dashboard */
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sub{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sub .ic{width:36px;height:36px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--c)}
.sub b{display:block}
.sub small{color:var(--muted)}
.sub .r{text-align:right;display:grid;gap:4px;justify-items:end;font-size:12px;color:var(--muted)}
.cur{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cur div{padding:6px 16px;border-left:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center}
.cur div:first-child{border-left:0}
.cur .code{font-weight:700}
.cur .code em{display:block;font-weight:500;color:var(--muted);font-size:12px}
.cur .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.cur .chg{grid-column:1/-1;text-align:right;font-size:12px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.stat svg{width:34px;height:34px;grid-row:span 2;color:var(--muted)}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;padding-top:10px}
.chart div{display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font-size:11px;color:var(--muted)}
.chart i{width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 0 0;display:block}
.chart div.now i{background:var(--ok)}
/* aprobación y chats */
.order{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:14px;display:grid;gap:8px}
.order .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.order ul{margin:0;padding-left:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chats{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:420px}
.clist{border-right:1px solid var(--line);display:grid;align-content:start}
.clist button{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px}
.clist button[aria-current="true"]{background:var(--raised)}
.clist .av{width:40px;height:40px;border-radius:50%;background:var(--wa-bubble);color:var(--ok);display:grid;place-items:center;grid-row:span 2;font-weight:800}
.clist small{color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;grid-column:2/4}
.clist time{color:var(--muted);font-size:12px}
.conv{display:grid;grid-template-rows:auto 1fr;min-width:0}
.conv .ch{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.msgs{padding:16px;display:grid;gap:12px;align-content:start;background:var(--bg);overflow:auto}
.bubble{justify-self:end;max-width:min(420px,100%);background:var(--wa-bubble);border-radius:12px 12px 2px 12px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px}
.bubble.in{justify-self:start;background:var(--raised);border-radius:12px 12px 12px 2px}
.bubble .auto{display:block;font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.06em;margin-bottom:4px}
.bubble time{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}

/* ============ TIENDA ============ */
.shop{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.shead{background:#05080f;border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:5}
.shead .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shead .blogo{margin-right:auto;font-size:19px;padding:0}
.credits{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.round{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;position:relative}
.round .n{position:absolute;top:-4px;right:-4px;background:var(--bad);border-radius:999px;font-size:11px;padding:0 6px;font-weight:800}
.sbody{max-width:1100px;width:100%;margin:0 auto;padding-block:22px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
.stabs{display:flex;gap:6px;flex-wrap:wrap}
.stabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted)}
.stabs button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;grid-template-rows:auto 1fr auto}
.pcard .plogo{width:44px;height:44px;border-radius:11px;font-size:16px}
.pcard h3{font-size:15px}
.pcard ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;color:var(--muted);font-size:13px}
.pcard li::before{content:"✓  ";color:var(--ok);font-weight:800}
.pcard .buy{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.codebox{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-block:10px}
.codebox:last-child{border:0}
.codebox b{font:500 22px var(--mono);letter-spacing:.2em;color:var(--ok)}
/* carrito */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;overflow:auto;display:grid;gap:12px;align-content:start;border-left:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px}
.drawer h2{font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.qty{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--raised)}
.total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.paysel{display:grid;gap:8px}
.paysel label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font-weight:600;cursor:pointer}
.paysel label small{display:block;color:var(--muted);font-weight:500}
.paysel input{margin-top:3px;accent-color:var(--accent)}
.qr{display:flex;gap:12px;align-items:center;background:var(--raised);border-radius:12px;padding:10px;font-size:13px;color:var(--muted)}
.qr canvas{width:92px;height:92px;border-radius:6px;flex:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,85%);z-index:30;height:auto;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none}
  .app.open .sscrim{display:block}
  .burger{display:inline-grid}
  .chats{grid-template-columns:1fr}
  .clist{border-right:0;border-bottom:1px solid var(--line)}
  .cur div{border-left:0;border-top:1px solid var(--line)}
  .cur div:first-child{border-top:0}
}
.sscrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<!-- ================= PANEL ================= -->
<div class="app" id="app">
  <div class="sscrim" id="sscrim"></div>
  <aside class="side" id="side">
    <div class="blogo"><i>G</i><div>Gabriel <span>Store</span></div></div>
    <div class="who"><div class="av">GS</div><span class="muted">gabriel</span><b>ADMIN</b></div>
    <nav class="menu" id="menu" aria-label="Panel"></nav>
    <a class="btn switch" href="#tienda"><svg width="16" height="16"><use href="#i-store"/></svg>Ver mi tienda</a>
  </aside>
  <main class="main">
    <div class="top">
      <button class="icon burger" id="burger" type="button" aria-label="Abrir menú"><svg width="18" height="18"><use href="#i-menu"/></svg></button>
      <h1 id="ptitle">Dashboard</h1>
      <span class="date" id="date"></span>
      <button class="icon" type="button" data-go="aprobacion" aria-label="Notificaciones"><svg width="16" height="16"><use href="#i-bell"/></svg></button>
    </div>
    <span class="note">Demo: cuentas, clientes y montos de ejemplo. Los cambios se guardan solo en este navegador.</span>
    <div id="pout" style="display:grid;gap:18px"></div>
  </main>
</div>

<!-- ================= TIENDA ================= -->
<div class="shop" id="shop" hidden>
  <header class="shead"><div class="in">
    <div class="blogo"><i>G</i><div>Gabriel <span>Store</span></div></div>
    <span class="credits" title="Tu saldo de créditos"><span id="cred">0</span><svg width="20" height="20"><use href="#i-coins"/></svg></span>
    <button class="round" id="openCart" type="button" aria-label="Carrito"><svg width="18" height="18"><use href="#i-cart"/></svg><span class="n" id="count" hidden>0</span></button>
    <a class="round" href="#panel" aria-label="Ir al panel del vendedor"><svg width="18" height="18"><use href="#i-menu"/></svg></a>
  </div></header>
  <div class="sbody">
    <div class="stabs" id="stabs">

  <div class="conv"><div class="ch"><span class="av" style="width:36px;height:36px;border-radius:50%;background:var(--wa-bubble);color:var(--ok);display:grid;place-items:center;font-weight:800">${esc(c.nombre[0])}</span><div><b>${esc(c.nombre)}</b><br><small class="muted mono">${esc(c.tel)}</small></div><a class="btn wa sm" style="margin-left:auto" target="_blank" rel="noopener" href="${waLink(c.tel,"")}">Abrir en WhatsApp</a></div>
  <div class="msgs">${c.msgs.map(m=>`<div class="bubble ${m.in?"in":""}">${m.auto?`<span class="auto">⚙ AUTOMÁTICO</span>`:""}${esc(m.txt)}<time>${fd(m.t)} ${ft(m.t)}</time></div>`).join("")}</div></div></div></section>`;
},
};
function venceP(a){const d=left(a.vence);return d<0?`<span class="pill p-bad">Vencido hace ${-d} d</span>`:d<=3?`<span class="pill p-warn">Vence en ${d} d</span>`:`<span class="pill p-ok">${d} días</span>`}

/* ================= TIENDA ================= */
function renderShop(){
  $("#cred").textContent=credits();
  document.querySelectorAll("#stabs button").forEach(b=>b.dataset.s===sview?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  const mine=S.inv.filter(a=>a.tel&&digits(a.tel).endsWith(myTel)).sort((a,b)=>a.vence-b.vence);
  const pend=S.orders.filter(o=>digits(o.tel).endsWith(myTel)&&o.estado==="Pendiente");
  const pendBox=pend.map(o=>`<div class="order"><div class="h"><b>Pedido #${o.id}</b><span class="pill p-warn">En verificación</span></div><span class="muted">Estamos revisando tu comprobante. Te llega todo por WhatsApp apenas se apruebe.</span></div>`).join("");
  $("#sout").innerHTML={
    catalogo:()=>`<div><h1 style="font-size:24px;font-weight:800">Hola, ${esc(CLIENTE_DEMO.nombre.split(" ")[0])} 👋</h1><p class="muted" style="margin:4px 0 0">Comprá con tus créditos y recibí tu cuenta al instante, o pagá con QR.</p></div>
      <div class="cards">${PRODUCTOS.map(p=>{const s=stock(p.id);return `<article class="pcard"><div class="plat">${plogo(p.id)}<div><h3>${esc(p.plat)}</h3><small class="muted">${esc(p.nombre)}</small></div></div>
        <ul>${p.feat.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
        <div class="buy"><div class="price">${p.precio} <small>créditos · ${s?`<span class="up">${s} disponibles</span>`:`<span class="down">Agotado</span>`}</small></div>
        <button class="btn pri sm" type="button" data-add="${p.id}" ${s?"":"disabled"}>${icon("cart",14)}Agregar</button></div></article>`}).join("")}</div>`,
    cuentas:()=>`${pendBox}<section class="box" style="background:var(--surface)"><h2>${icon("users")}Mis cuentas</h2>
      ${mine.length?`<div class="scroll"><table><thead><tr><th>Email</th><th>Perfil</th><th>Contraseña</th><th>PIN</th><th>Plataforma</th><th>Fecha de expiración</th><th>Acciones</th></tr></thead><tbody>
      ${mine.map(a=>`<tr><td class="mono">${esc(a.email)}</td><td>${esc(a.perfil)}</td><td class="mono">${esc(a.pass)}</td><td class="mono">${esc(a.pin)}</td><td><div class="plat">${plogo(a.prod)}${esc(P(a.prod).nombre)}</div></td>
        <td>${fd(a.vence)} ${venceP(a)}</td><td><button class="btn light sm" type="button" data-selfrenew="${a.id}">${icon("renew",14)}Renovar · ${P(a.prod).precio}</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Todavía no tenés cuentas. Comprá una desde el catálogo.</p>`}</section>`,
    codigos:()=>{const c=S.codes.filter(c=>mine.some(a=>a.email===c.email));return `<section class="box"><h2>${icon("mail")}Códigos de acceso <span class="pill p-ok">Sincronizado</span></h2>
      <p class="muted" style="margin:0">Si Netflix o Disney+ te piden un código, aparece acá. Solo ves los de tus cuentas.</p>
      ${c.length?c.map(c=>`<div class="codebox"><div>${esc(c.asunto)}<br><small class="muted mono">${esc(c.email)} · ${ft(c.t)}</small></div><b>${esc(c.codigo)}</b></div>`).join(""):`<p class="muted">No hay códigos nuevos.</p>`}</section>`},
    recargar:()=>`${pendBox}<section class="box"><h2>${icon("coins")}Recargar créditos <small>· 1 crédito = Bs 1</small></h2>
      <p class="muted" style="margin:0">Tu saldo: <b style="color:var(--ink)">${credits()} créditos</b>. Pagá con QR, subí el comprobante y te acreditamos cuando lo verifiquemos.</p>
      <form class="form" id="topup"><label for="tAmt">Monto<select id="tAmt">${[50,100,200,500].map(v=>`<option value="${v}">${v} créditos · Bs ${v}</option>`).join("")}</select></label>
      <label for="tProof">Comprobante<input id="tProof" type="file" accept="image/*,application/pdf"></label><button class="btn pri" type="submit">Enviar recarga</button></form></section>`,
  }[sview]();
}
function renderCart(){
  const tot=cart.reduce((s,l)=>s+P(l.prod).precio*l.qty,0), n=cart.reduce((s,l)=>s+l.qty,0);
  $("#count").textContent=n;$("#count").hidden=!n;$("#total").textContent=tot+" créditos";$("#credInCart").textContent=credits();
  $("#lines").innerHTML=cart.length?cart.map((l,k)=>`<div class="line"><div class="plat">${plogo(l.prod)}<div><b>${esc(P(l.prod).plat)}</b><br><small class="muted">${esc(P(l.prod).nombre)}</small></div></div>
    <div class="qty"><button type="button" data-dec="${k}" aria-label="Quitar uno">−</button>${l.qty}<button type="button" data-inc="${k}" aria-label="Sumar uno">+</button></div></div>`).join(""):`<p class="muted">Tu carrito está vacío.</p>`;
  $("#checkout").hidden=!cart.length;
  const qr=$("#payQ").checked;$("#qrbox").hidden=!qr;
  const short=!qr&&tot>credits();$("#payBtn").disabled=short;$("#payBtn").textContent=short?`Te faltan ${tot-credits()} créditos`:qr?"Enviar pedido":"Comprar con créditos";
}
function openCart(v){$("#cart").hidden=!v;$("#scrim").hidden=!v;if(v){$("#done").hidden=true;renderCart()}}
function drawQR(){const c=$("#qr"),x=c.getContext("2d"),n=21,s=92/n;x.fillStyle="#fff";x.fillRect(0,0,92,92);x.fillStyle="#111";let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const a=i<7?0:i>13?14:-1,b=j<7?0:j>13?14:-1;if(a>=0&&b>=0&&!(a&&b)){const di=i-a,dj=j-b;if(di===0||di===6||dj===0||dj===6||(di>1&&di<5&&dj>1&&dj<5))x.fillRect(j*s,i*s,s,s)}else if(rnd()>.55)x.fillRect(j*s,i*s,s,s)}}

/* ================= ACCIONES ================= */
function approve(id){
  const o=S.orders.find(x=>x.id===id);
  if(o.recarga){const k=digits(o.tel).slice(-8);S.creditos[k]=(S.creditos[k]||0)+o.recarga;o.estado="Acreditado";logChat(o.tel,o.cliente,`✅ *Recarga aprobada*\nSe acreditaron ${o.recarga} créditos a tu saldo en ${TIENDA.nombre}.`);save();renderPanel();toast(`${o.recarga} créditos acreditados a ${o.cliente}`);return}
  const asig=assign(o.items,o.cliente,o.tel);
  if(!asig){toast("No hay perfiles libres suficientes: cargá una cuenta en Cuentas");return}
  o.estado="Entregado";S.ingresos.BOB[0]+=o.total;logChat(o.tel,o.cliente,deliveryText(asig));save();renderPanel();toast(`Pedido #${id} entregado por WhatsApp`);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.go){pview=d.go;if(location.hash!=="#panel")location.hash="panel";renderPanel();scrollTo(0,0)}
  else if(d.toast)toast(d.toast)
  else if(d.approve)approve(+d.approve)
  else if(d.reject){S.orders.find(o=>o.id===+d.reject).estado="Rechazado";save();renderPanel();toast("Rechazado")}
  else if(d.renewa){const a=S.inv.find(a=>a.id===+d.renewa);a.vence=Math.max(a.vence,T0)+P(a.prod).dias*DAY;S.ingresos.BOB[0]+=P(a.prod).precio;
    logChat(a.tel,a.cliente,`✅ *Renovación confirmada*\n${P(a.prod).nombre} (${a.perfil}) válido hasta *${fd(a.vence)}*.`);save();renderPanel();toast(`Renovado hasta ${fd(a.vence)}`)}
  else if(d.remind){const a=S.inv.find(a=>a.id===+d.remind),dd=left(a.vence);logChat(a.tel,a.cliente,`Hola ${a.cliente.split(" ")[0]} 👋\nTu ${P(a.prod).nombre} (${a.perfil}) ${dd<0?"venció el":"vence el"} ${fd(a.vence)}.\nRenová desde gabostore.lat → Mis cuentas para no perder el acceso.`);save();toast("Recordatorio enviado (ver Chats de WhatsApp)")}
  else if(d.free){Object.assign(S.inv.find(a=>a.id===+d.free),{estado:"Disponible",cliente:null,tel:null,vence:null});save();renderPanel();toast("Perfil liberado")}
  else if(d.fclear){flt={plat:"",estado:"",q:""};renderPanel()}
  else if(d.addacc){$("#accForm").hidden=!$("#accForm").hidden}
  else if(d.chat){chatSel=+d.chat;renderPanel()}
  else if(d.newcode){const a=S.inv.find(a=>a.estado==="Asignada");S.codes.unshift({email:a.email,plat:a.prod,asunto:"Tu código de acceso temporal",codigo:String(100+Math.floor(Math.random()*900))+" "+String(100+Math.floor(Math.random()*900)),t:Date.now()});save();renderPanel();toast("Llegó un código nuevo")}
  else if(d.s){sview=d.s;renderShop()}
  else if(d.add){const l=cart.find(x=>x.prod===d.add);l?l.qty++:cart.push({prod:d.add,qty:1});renderCart();toast(`${P(d.add).plat} agregado al carrito`)}
  else if(d.inc){cart[d.inc].qty++;renderCart()}
  else if(d.dec){if(--cart[d.dec].qty<=0)cart.splice(d.dec,1);renderCart()}
  else if(d.selfrenew){const a=S.inv.find(a=>a.id===+d.selfrenew),p=P(a.prod);
    if(credits()<p.precio){toast(`Te faltan ${p.precio-credits()} créditos: recargá tu saldo`);sview="recargar";renderShop();return}
    S.creditos[myTel]-=p.precio;a.vence=Math.max(a.vence,T0)+p.dias*DAY;logChat(a.tel,a.cliente,`✅ *Renovación confirmada*\n${p.nombre} (${a.perfil}) válido hasta *${fd(a.vence)}*.`);save();renderShop();toast(`Renovado hasta ${fd(a.vence)}`)}
});
$("#burger").onclick=()=>$("#app").classList.add("open");
$("#sscrim").onclick=()=>$("#app").classList.remove("open");
$("#openCart").onclick=()=>openCart(true);
$("#closeCart").onclick=$("#scrim").onclick=()=>openCart(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){openCart(false);$("#app").classList.remove("open")}});
document.addEventListener("change",e=>{const id=e.target.id;
  if(id==="fPlat")flt.plat=e.target.value;else if(id==="fEst")flt.estado=e.target.value;else if(e.target.name==="pay"){renderCart();return}else return;renderPanel()});
document.addEventListener("input",e=>{if(e.target.id==="fQ"){flt.q=e.target.value.toLowerCase();clearTimeout(flt.t);flt.t=setTimeout(()=>{renderPanel();const f=$("#fQ");f.focus();f.setSelectionRange(f.value.length,f.value.length)},300)}});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;
  if(id==="sellForm"){const prod=$("#vProd").value,c=$("#vName").value.trim(),t=$("#vTel").value.trim();const asig=assign([{prod,qty:1}],c,t);
    if(!asig){toast("Sin perfiles libres de ese producto");return}const cur=$("#vCur").value;S.ingresos[cur][0]+=cur==="BOB"?P(prod).precio:+(P(prod).precio/6.96).toFixed(2);
    logChat(t,c,deliveryText(asig));save();pview="chats";chatSel=0;renderPanel();toast(`Vendido: ${asig[0].perfil} entregado a ${c}`)}
  else if(id==="accForm"){const n=Math.max(1,Math.min(10,+$("#aN").value||1)),prod=$("#aProd").value;let x=Math.max(...S.inv.map(a=>a.id));
    for(let i=1;i<=n;i++){x++;S.inv.push({id:x,prod,email:$("#aMail").value.trim(),pass:$("#aPass").value.trim(),perfil:n===1?"Cuenta":"Perfil "+i,pin:n===1?"-":String(1000+(x*37)%9000),estado:"Disponible",cliente:null,tel:null,vence:null,exp:T0+60*DAY,prov:"Proveedor Andes"})}
    save();renderPanel();toast(`${n} perfil(es) agregados`)}
  else if(id==="checkout"){const tot=cart.reduce((s,l)=>s+P(l.prod).precio*l.qty,0),items=cart.map(l=>({...l}));
    if($("#payC").checked){const asig=assign(items,CLIENTE_DEMO.nombre,CLIENTE_DEMO.tel);if(!asig){toast("Se agotó un producto, revisá tu carrito");return}
      S.creditos[myTel]-=tot;const txt=deliveryText(asig);logChat(CLIENTE_DEMO.tel,CLIENTE_DEMO.nombre,txt);save();cart.length=0;renderCart();renderShop();$("#checkout").hidden=true;
      $("#done").hidden=false;$("#done").innerHTML=`<div class="box"><h2>¡Listo! <span class="pill p-ok">Entregado</span></h2><div class="bubble" style="justify-self:stretch;max-width:none"><span class="auto">⚙ AUTOMÁTICO · enviado a tu WhatsApp</span>${esc(txt)}</div><button class="btn light" type="button" data-s="cuentas" onclick="openCart(false)">Ver mis cuentas</button></div>`}
    else{const o={id:S.nextOrder++,cliente:CLIENTE_DEMO.nombre,tel:CLIENTE_DEMO.tel,items,total:tot,pago:"QR bancario",comprobante:$("#proof").files[0]?.name||"",estado:"Pendiente",fecha:Date.now()};
      S.orders.push(o);save();cart.length=0;renderCart();$("#checkout").hidden=true;$("#done").hidden=false;
      $("#done").innerHTML=`<div class="box"><h2>Pedido #${o.id} <span class="pill p-warn">En verificación</span></h2><p class="muted" style="margin:0">Cuando verifiquemos tu pago te llega la cuenta por WhatsApp.</p><p class="muted" style="margin:0">En la demo: andá al panel → <b>Aprobación de ventas</b> y aprobalo.</p></div>`}}
  else if(id==="topup"){const v=+$("#tAmt").value;S.orders.push({id:S.nextOrder++,cliente:CLIENTE_DEMO.nombre,tel:CLIENTE_DEMO.tel,recarga:v,items:[],total:v,pago:"QR bancario",comprobante:$("#tProof").files[0]?.name||"",estado:"Pendiente",fecha:Date.now()});
    save();renderShop();toast("Recarga enviada: queda en verificación")}
});

window.addEventListener("hashchange",route);
$("#date").textContent=new Date().toLocaleDateString("es-BO",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
drawQR();renderCart();route();
