<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GaboHub · Para revendedores</title>
<!--
  Video promo vertical (1080x1920) de GaboHub, la plataforma para revendedores de streaming. Animación determinista: window.seek(t) dibuja el
  cuadro del segundo t. render.cjs la captura cuadro a cuadro con Playwright y ffmpeg arma el MP4.
  Abrila en el navegador con ?play para verla en vivo.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0c0f; }
  body { font-family: "Inter Display", "Inter", "Noto Color Emoji", sans-serif; color: #f6f4ef; -webkit-font-smoothing: antialiased; }
  :root { --ink: #0b0c0f; --ink2: #15171c; --paper: #f6f4ef; --red: #3984ff; --red2: #2563eb; --blue: #22c6e8; --blue2: #0e6f8a; --gold: #d4ab62; --green: #2f8a70; --violet: #7c5cff; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; display: none; }
  .emoji { font-family: "Noto Color Emoji", sans-serif; font-weight: 400; }

  /* fondo */
  #glowA, #glowB { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; }
  #glowA { background: radial-gradient(circle, rgba(57, 132, 255, .45), rgba(57, 132, 255, 0) 62%); }
  #glowB { background: radial-gradient(circle, rgba(124, 92, 255, .40), rgba(124, 92, 255, 0) 62%); }
  #stripes { position: absolute; inset: -200px; opacity: .055;
    background: repeating-linear-gradient(-45deg, var(--red) 0 46px, var(--paper) 46px 92px, var(--violet) 92px 138px, var(--paper) 138px 184px); }
  #grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; pointer-events: none; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); pointer-events: none; }

  /* marca */
  .mark { position: absolute; overflow: hidden; background: linear-gradient(140deg, #5b9bff, #2563eb 55%, #4f46e5); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px rgba(255,255,255,.14) inset, 0 20px 60px rgba(57,132,255,.35); }
  .mark .s1 { position: absolute; left: -30%; top: -60%; width: 120%; height: 120%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); }
  .mark .s2 { display: none; }
  .mark b { position: relative; font-weight: 900; line-height: 1; color: #fff; letter-spacing: -.04em; }

  /* textos */
  .kicker { font-size: 34px; font-weight: 800; letter-spacing: .22em; color: var(--red); text-transform: uppercase; }
  .title { font-size: 98px; font-weight: 900; line-height: .98; letter-spacing: -.035em; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0 .06em; margin-bottom: -.06em; }
  .w > span { display: inline-block; position: relative; }
  .w .hl { position: absolute; left: -.08em; right: -.08em; bottom: .06em; height: .42em; background: var(--red); transform-origin: left center; z-index: -1; border-radius: .06em; }
  .w.em > span { z-index: 1; }

  /* celular */
  .phone { position: absolute; width: 620px; height: 1300px; border-radius: 86px; padding: 18px;
    background: linear-gradient(145deg, #3a3e46, #15171b 30%, #0c0d10 60%, #2b2f36);
    box-shadow: 0 60px 120px rgba(0,0,0,.65), 0 0 0 2px rgba(255,255,255,.07), 0 0 120px rgba(57,132,255,.22); }
  .screen { position: relative; width: 584px; height: 1264px; border-radius: 70px; overflow: hidden; background: #0f1113; }
  .screen img { position: absolute; left: 0; width: 584px; display: block; }
  .sbar { position: absolute; left: 0; right: 0; top: 0; height: 62px; background: #0c0e10; z-index: 4; display: flex; align-items: center; justify-content: space-between; padding: 6px 54px 0 62px; font: 600 26px "Inter", sans-serif; color: #f6f4ef; }
  .sbar .bat { width: 40px; height: 19px; border: 2px solid rgba(246,244,239,.6); border-radius: 6px; padding: 2px; }
  .sbar .bat i { display: block; height: 100%; width: 78%; background: #f6f4ef; border-radius: 2px; }
  .island { position: absolute; left: 50%; top: 14px; width: 150px; height: 40px; margin-left: -75px; border-radius: 30px; background: #000; z-index: 5; }
  .glare { position: absolute; inset: 0; border-radius: 70px; background: linear-gradient(115deg, rgba(255,255,255,.10), rgba(255,255,255,0) 32%); z-index: 6; pointer-events: none; }

  .chip { position: absolute; padding: 26px 34px; border-radius: 28px; background: var(--paper); color: #121418; font-size: 42px; font-weight: 800; letter-spacing: -.01em;
    box-shadow: 0 30px 60px rgba(0,0,0,.45); white-space: nowrap; transform-origin: 20% 50%; }
  .chip .emoji { margin-right: 14px; }

  .card { position: absolute; padding: 30px 38px; border-radius: 30px; background: #f6f4ef; color: #121418; font-size: 46px; font-weight: 800; white-space: nowrap; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
  .card .x { position: absolute; left: -10px; right: -10px; top: 50%; height: 12px; margin-top: -6px; background: var(--red); border-radius: 8px; transform-origin: left center; }

  .pill { display: inline-block; padding: 20px 34px; border-radius: 999px; font-size: 38px; font-weight: 800; }
  #progress { position: absolute; left: 70px; right: 70px; top: 140px; height: 8px; display: flex; gap: 10px; }
  #progress i { flex: 1; border-radius: 4px; background: rgba(246,244,239,.18); overflow: hidden; position: relative; }
  #progress i b { position: absolute; inset: 0; background: var(--paper); transform-origin: left; }

  #wipe { position: absolute; top: -200px; height: 2320px; width: 1900px; display: none;
    background: repeating-linear-gradient(90deg, var(--red) 0 120px, var(--paper) 120px 240px, var(--violet) 240px 360px, var(--blue) 360px 480px);
    box-shadow: 0 0 80px rgba(0,0,0,.6); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  /* subtítulos de la voz (por encima de la zona que tapa TikTok abajo) */
  #cap { position: absolute; left: 70px; right: 70px; top: 1590px; text-align: center; z-index: 20; }
  #cap span.box { display: inline-block; padding: 18px 30px 20px; border-radius: 22px; background: rgba(8, 12, 24, .82); box-shadow: 0 16px 40px rgba(0,0,0,.45);
    font-size: 52px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; color: rgba(246,244,239,.55); }
  #cap b { font-weight: 800; color: #f6f4ef; }
  #cap b.now { color: #6ea8ff; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div id="glowA"></div><div id="glowB"></div><div id="stripes"></div>
  </div>
  <div id="cam" class="abs" style="inset:0">
    <div id="scenes"></div>
  </div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div id="cap"></div>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
</div>
<script src="captions.js"></script>
<script>
// ------------------------------------------------------------------ tiempo y música
const BPM = 125, BEAT = 60 / BPM, BAR = BEAT * 4;
const FB = 2 * BAR;   // cada función dura 2 compases (le da tiempo a la voz)
const T_LOGO = 3 * BAR, T_FEAT = 5 * BAR, N_FEAT = 7, T_MONT = T_FEAT + N_FEAT * FB, T_OUT = T_MONT + 2 * BAR, DURATION = T_OUT + 3 * BAR; // 46.08 s
window.DURATION = DURATION;

// ------------------------------------------------------------------ utilidades
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const oCubic = (p) => 1 - Math.pow(1 - p, 3);
const iCubic = (p) => p * p * p;
const ioCubic = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const oExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const oBack = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const spring = (p) => (p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(11 * p));
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const set = (e, css) => Object.assign(e.style, css);
const markHTML = (size) => `<div class="mark" style="width:${size}px;height:${size}px;border-radius:${size * .3}px"><i class="s1"></i><i class="s2"></i><b style="font-size:${size * .58}px;margin-top:${-size * .02}px">G</b></div>`;

/** Título con palabras animables; *palabra* = resaltada. */
function titleHTML(text) {
  let inEm = false;
  return text.split(" ").map((w) => {
    const opens = w.startsWith("*"), closes = w.replace(/[,.]$/, "").endsWith("*");
    const em = inEm || opens;
    inEm = (inEm || opens) && !closes;
    w = w.replace(/\*/g, "");
    return `<span class="w${em ? " em" : ""}"><span>${em ? '<i class="hl"></i>' : ""}${w}</span></span>`;
  }).join(" ");
}
// emojis: se marcan para que usen la fuente de color
const emo = (s) => s.replace(/(\p{Extended_Pictographic}️?|\p{Regional_Indicator}{2})/gu, '<span class="emoji">$1</span>');

const scenes = $("#scenes");
const registry = [];   // { start, end, el, update(lt, t) }
function scene(start, end, node, update) { scenes.appendChild(node); registry.push({ start, end, el: node, update }); }

// ------------------------------------------------------------------ 1. gancho
{
  const s = el(`<section class="scene">
    <div class="abs title" id="h1" style="left:70px;top:330px;width:940px;font-size:124px">${titleHTML("¿Vendés *streaming?*")}</div>
    <div class="abs title" id="h2" style="left:70px;top:330px;width:940px;font-size:124px">${titleHTML("Esto se *terminó.*")}</div>
  </section>`);
  const cards = [
    ["📒 Vencimientos en un cuaderno", 70, 760, -6],
    ["⏳ Esperando al proveedor", 280, 950, 5],
    ["💬 Clientes reclamando", 110, 1140, 3],
    ["🧮 ¿Cuánto gané? Ni idea", 300, 1330, -4],
  ].map(([txt, x, y, r]) => {
    const c = el(`<div class="card" style="left:${x}px;top:${y}px">${emo(txt)}<i class="x"></i></div>`);
    s.appendChild(c);
    return { c, x, y, r, x2: c.querySelector(".x") };
  });
  const h1w = [...s.querySelectorAll("#h1 .w")], h2w = [...s.querySelectorAll("#h2 .w")];
  const K = 1.25;   // el gancho dura 3 compases: todo va 1,25 veces más lento que en el de Barbiño
  scene(0, T_LOGO, s, (lr) => {
    const lt = lr / K;
    // título 1 (palabras en negras)
    const out1 = P(lt, BAR - .1, .2);
    h1w.forEach((w, i) => {
      const p = oExpo(P(lt, i * BEAT * .5, .35));
      set(w.firstChild, { transform: `translateY(${(1 - p) * 110}%)` });
      const hl = w.querySelector(".hl"); if (hl) set(hl, { transform: `scaleX(${oCubic(P(lt, .9, .3))})` });
    });
    set($("#h1", s), { opacity: 1 - out1, transform: `translateY(${-out1 * 40}px)` });
    // título 2
    h2w.forEach((w, i) => {
      const p = oExpo(P(lt, BAR + 1.2 + i * .12, .35));
      set(w.firstChild, { transform: `translateY(${(1 - p) * 110}%)` });
      const hl = w.querySelector(".hl"); if (hl) set(hl, { transform: `scaleX(${oCubic(P(lt, BAR + 1.55, .25))})` });
    });
    const zoom = iCubic(P(lr, T_LOGO - .45, .45));
    set($("#h2", s), { opacity: lt > BAR ? 1 : 0, transform: `scale(${1 + zoom * 1.4})`, transformOrigin: "40% 50%", filter: `blur(${zoom * 14}px)` });
    // tarjetas del caos: entran, se tachan, se van
    cards.forEach((k, i) => {
      const pin = spring(P(lt, BEAT * 2 + i * BEAT * .5, .5));
      const strike = oCubic(P(lt, BAR + i * BEAT * .5, .22));
      const gone = iCubic(P(lt, BAR + 1.45 + i * .05, .3));
      const shake = Math.sin(lt * 70 + i) * 6 * P(lt, BAR + i * BEAT * .5, .05) * (1 - P(lt, BAR + i * BEAT * .5 + .12, .1));
      set(k.c, {
        opacity: clamp(pin * 3) * (1 - gone),
        transform: `translate(${shake + gone * (i % 2 ? 500 : -500)}px, ${(1 - pin) * 120}px) rotate(${k.r + gone * (i % 2 ? 25 : -25)}deg) scale(${.6 + .4 * pin})`,
        filter: strike > 0 ? `saturate(${1 - strike * .6})` : "none",
      });
      set(k.x2, { transform: `scaleX(${strike})` });
    });
  });
}

// ------------------------------------------------------------------ 2. logo
{
  const s = el(`<section class="scene">
    <div class="abs" id="lgRing" style="left:540px;top:600px"></div>
    <div class="abs" id="lgMark" style="left:390px;top:450px">${markHTML(300)}</div>
    <div class="abs" id="lgWord" style="left:0;right:0;top:820px;text-align:center;font-size:200px;font-weight:900;letter-spacing:-.05em">${[..."GaboHub"].map((c) => `<span style="display:inline-block">${c}</span>`).join("")}</div>
    <div class="abs" id="lgTag" style="left:0;right:0;top:1090px;text-align:center;font-size:66px;font-weight:800;letter-spacing:-.02em;line-height:1.1">Vendé streaming<br><span style="color:var(--red)">con tu propia marca.</span></div>
    <div class="abs" id="lgSoon" style="left:0;right:0;top:1300px;text-align:center"><span class="pill" style="background:var(--red);color:#fff;letter-spacing:.24em;font-size:44px;padding:24px 40px 24px 52px">PARA REVENDEDORES</span></div>
    <div class="abs" id="lgNext" style="left:0;right:0;top:1470px;text-align:center;font-size:50px;font-weight:800;color:rgba(246,244,239,.85)">${emo("Mirá todo lo que trae 👇")}</div>
  </section>`);
  const ring = $("#lgRing", s);
  for (let i = 0; i < 4; i++) ring.appendChild(el(`<i style="position:absolute;left:-230px;top:-230px;width:460px;height:460px;border-radius:50%;border:4px solid rgba(246,244,239,.5)"></i>`));
  const rings = [...ring.children];
  const letters = [...s.querySelectorAll("#lgWord span")];
  scene(T_LOGO, T_FEAT, s, (lt) => {
    const pm = spring(P(lt, 0, .9));
    const lift = ioCubic(P(lt, BAR * 1.5, .5));
    set($("#lgMark", s), { transform: `translateY(${-lift * 60}px) scale(${pm}) rotate(${(1 - pm) * -30}deg)` });
    rings.forEach((r, i) => {
      const bt = (lt - i * BEAT) ; const ph = bt < 0 ? 0 : (bt % (BEAT * 4)) / (BEAT * 4 * .7);
      const p = clamp(ph);
      set(r, { transform: `translateY(${-lift * 60}px) scale(${.7 + p * 1.6})`, opacity: bt < 0 ? 0 : (1 - p) * .55 });
    });
    letters.forEach((c, i) => {
      const p = oBack(P(lt, .25 + i * .05, .45), 2.2);
      set(c, { transform: `translateY(${(1 - p) * 140 - lift * 60}px) rotate(${(1 - p) * 12}deg)`, opacity: clamp(P(lt, .25 + i * .05, .15)) });
    });
    const pt = oExpo(P(lt, 1.0, .5));
    set($("#lgTag", s), { opacity: pt, transform: `translateY(${(1 - pt) * 50 - lift * 60}px)` });
    const ps = spring(P(lt, 1.44, .6));
    set($("#lgSoon", s), { opacity: clamp(ps * 2), transform: `translateY(${-lift * 60}px) scale(${.5 + .5 * ps})` });
    const pn = oExpo(P(lt, BAR * 1.5 + .1, .4));
    const bob = Math.sin(lt * 9) * 8 * pn;
    set($("#lgNext", s), { opacity: pn, transform: `translateY(${(1 - pn) * 40 + bob - lift * 60}px)` });
    const out = iCubic(P(lt, 2 * BAR - .3, .3));
    set(s, { transform: `scale(${1 + out * .25})`, opacity: 1 - out });
  });
}

// ------------------------------------------------------------------ 3. funciones
const FEATS = [  // scroll: cuánto baja la captura (px de la imagen de 1170 de ancho)
  { k: "Precios de mayorista", t: "Comprá a *precio de revendedor*", src: "precios", chip: "🏷️ Netflix Bs 25 · público Bs 35", scroll: 2700 },
  { k: "Entrega al instante", t: "La cuenta te llega *al toque*", src: "cuentas", chip: "⚡ Sin esperar a nadie", scroll: 1500 },
  { k: "Tus clientes", t: "Sabé quién vence *esta semana*", src: "panel", chip: "⏰ 16 vencen en 7 días", scroll: 420 },
  { k: "Renovar", t: "Renová *en un toque*", src: "vencen", chip: "💬 Aviso listo por WhatsApp", scroll: 1500 },
  { k: "Tu tienda", t: "Tu tienda, *con tu marca*", src: "tienda", full: true, chip: "🎨 Tu logo y tus colores", scroll: 1450 },
  { k: "Combos", t: "Armá *tus propios* combos", src: "combos", chip: "🎁 Dúo Series · Bs 65", scroll: 2300 },
  { k: "Referidos", t: "Traé revendedores y *ganá saldo*", src: "referidos", chip: "🎁 Bs 20 por cada uno", scroll: 500 },
];
const SC = 584 / 1170; // escala de la captura dentro de la pantalla
const progress = el(`<div id="progress">${FEATS.map(() => "<i><b></b></i>").join("")}</div>`);
const brandBar = el(`<div class="abs" style="left:70px;right:70px;top:182px;height:60px;display:flex;align-items:center;gap:18px">
  <span style="position:relative;width:54px;height:54px;flex:none">${markHTML(54)}</span><span style="font-size:40px;font-weight:900;letter-spacing:-.03em">GaboHub</span>
  <span style="margin-left:auto;font-size:26px;font-weight:800;letter-spacing:.24em;color:rgba(246,244,239,.7)">PARA REVENDEDORES</span></div>`);
const featChrome = el(`<section class="scene" style="z-index:5;pointer-events:none"></section>`);
featChrome.append(progress, brandBar);
const bars = [...progress.querySelectorAll("b")];

FEATS.forEach((f, i) => {
  const start = T_FEAT + i * FB, dir = i % 2 ? -1 : 1;
  const imgs = f.full
    ? `<div class="abs" style="left:0;right:0;top:62px;bottom:0;overflow:hidden"><img class="body" src="assets/${f.src}-full.jpg" style="top:0"></div>`
    : `<img class="top" src="assets/${f.src}-top.jpg" style="top:62px;z-index:2"><div class="bw abs" style="left:0;right:0;top:${62 + Math.round(231 * SC)}px;bottom:0;overflow:hidden"><img class="body" src="assets/${f.src}-body.jpg" style="top:0"></div><img class="nav" src="assets/${f.src}-nav.png" style="bottom:0;z-index:3">`;
  const s = el(`<section class="scene">
    <div class="abs kicker" style="left:70px;top:285px"><span style="color:var(--paper)">${String(i + 1).padStart(2, "0")}</span>&nbsp;&nbsp;—&nbsp;&nbsp;${f.k}</div>
    <div class="abs title" style="left:70px;top:345px;width:950px">${titleHTML(f.t)}</div>
    <div class="phone" style="left:${dir > 0 ? 300 : 160}px;top:720px"><div class="screen">${imgs}<div class="sbar"><span>9:41</span><span class="bat"><i></i></span></div><i class="island"></i><i class="glare"></i></div></div>
    <div class="chip" style="left:${dir > 0 ? 60 : 420}px;top:1180px">${emo(f.chip)}</div>
  </section>`);
  const words = [...s.querySelectorAll(".w")], hls = [...s.querySelectorAll(".hl")];
  const phone = $(".phone", s), body = $(".body", s), chip = $(".chip", s), kick = $(".kicker", s);
  scene(start, start + FB, s, (lt) => {
    const e = oExpo(P(lt, 0, .5));
    const x = iCubic(P(lt, FB - .16, .16));
    const sway = Math.sin((lt + i) * 2.2) * 1.2;
    set(phone, {
      transform: `translate(${dir * 760 * (1 - e) - dir * 1100 * x}px, ${140 * (1 - e)}px) rotate(${dir * (4 * (1 - e) - 3) + sway}deg)`,
      filter: (1 - e) > .02 || x > .02 ? `blur(${(1 - e) * 10 + x * 16}px)` : "none",
    });
    const sp = ioCubic(P(lt, .6, FB - 1.3));
    set(body, { transform: `translateY(${-sp * f.scroll * SC}px)` });
    words.forEach((w, j) => {
      const p = oExpo(P(lt, .04 + j * .045, .4));
      set(w.firstChild, { transform: `translateY(${(1 - p) * 112}%)` });
    });
    hls.forEach((h) => set(h, { transform: `scaleX(${oCubic(P(lt, .45, .3))})` }));
    const k = oCubic(P(lt, 0, .3));
    set(kick, { opacity: k, transform: `translateX(${(1 - k) * -40}px)` });
    const c = oBack(P(lt, .62, .4), 2.4);
    set(chip, { opacity: clamp(c * 3), transform: `scale(${c}) rotate(${dir * -3}deg) translateX(${-dir * 1000 * x}px)` });
    const outT = P(lt, FB - .14, .14);
    set(s.querySelector(".title"), { opacity: 1 - outT, transform: `translateX(${-dir * 300 * iCubic(outT)}px)` });
    set(kick, { opacity: k * (1 - outT) });
  });
});
scenes.appendChild(featChrome);
registry.push({ start: T_FEAT, end: T_MONT, el: featChrome, update: (lt) => {
  const fi = Math.floor(lt / FB);
  bars.forEach((b, i) => set(b, { transform: `scaleX(${i < fi ? 1 : i > fi ? 0 : (lt - fi * FB) / FB})` }));
  const e = oCubic(P(lt, 0, .4));
  set(featChrome, { opacity: e });
} });

// ------------------------------------------------------------------ 4. ráfaga de extras
{
  const WORDS = [["🔑", "Códigos de acceso"], ["🏷️", "Cupones propios"], ["📲", "Renovar con QR"], ["🧾", "Comprobantes"], ["💬", "Avisos por WhatsApp"], ["🔍", "Buscador de clientes"], ["📋", "Copiar datos"], ["🔐", "Acceso con PIN"],
    ["🛍️", "Descuento por cantidad"], ["🕗", "Tu horario de atención"], ["📖", "Guía paso a paso"], ["🚦", "Vencidas y al día"], ["💵", "Tus precios, tu ganancia"], ["🛡️", "Tus clientes, solo tuyos"], ["📱", "Todo desde el celular"], ["🌎", "Bolivia · Panamá · Paraguay"]];
  const BGS = [["#0b0c0f", "#f6f4ef"], ["#2563eb", "#fff"], ["#f6f4ef", "#121418"], ["#5b3fd9", "#fff"]];
  const s = el(`<section class="scene">
    <div class="abs" id="mBg" style="inset:0"></div>
    <div class="abs" id="mTop" style="left:0;right:0;top:360px;text-align:center;font-size:52px;font-weight:900;letter-spacing:.24em">Y ADEMÁS…</div>
    <div class="abs" id="mWord" style="left:60px;right:60px;top:640px;text-align:center"></div>
    <div class="abs" id="mCount" style="left:0;right:0;top:1260px;text-align:center;font-size:64px;font-weight:900;letter-spacing:-.02em"></div>
  </section>`);
  scene(T_MONT, T_OUT, s, (lt) => {
    const step = BEAT / 2, i = Math.min(WORDS.length - 1, Math.floor(lt / step)), wl = lt - i * step;
    const [bg, fg] = BGS[i % 4];
    set($("#mBg", s), { background: bg });
    set($("#mTop", s), { color: fg, opacity: .75 });
    const w = WORDS[i];
    const key = String(i);
    const box = $("#mWord", s);
    if (box.dataset.k !== key) {
      box.dataset.k = key;
      box.innerHTML = `<div class="emoji" style="font-size:190px;line-height:1.1">${w[0]}</div><div style="font-size:${w[1].length > 22 ? 88 : w[1].length > 16 ? 100 : 124}px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:30px">${w[1]}</div>`;
    }
    const p = oExpo(clamp(wl / .16));
    set(box, { color: fg, transform: `scale(${1.35 - .35 * p}) rotate(${(i % 2 ? 2 : -2) * (1 - p)}deg)`, opacity: clamp(p * 2) });
    const n = Math.round(lerp(8, 23, clamp(lt / (2 * BAR - .3))));
    set($("#mCount", s), { color: fg });
    $("#mCount", s).textContent = `+${n} funciones`;
  });
}

// ------------------------------------------------------------------ 5. cierre
{
  const pillCss = "background:rgba(246,244,239,.1);border:2px solid rgba(246,244,239,.25);font-size:36px;padding:18px 30px";
  const s = el(`<section class="scene">
    <div class="abs" id="oMark" style="left:415px;top:420px">${markHTML(250)}</div>
    <div class="abs" id="oWord" style="left:0;right:0;top:720px;text-align:center;font-size:190px;font-weight:900;letter-spacing:-.05em">GaboHub</div>
    <div class="abs" id="oSoon" style="left:0;right:0;top:970px;text-align:center;font-size:74px;font-weight:900;letter-spacing:.08em;
      background:linear-gradient(90deg,#3984ff,#f6f4ef 45%,#22c6e8 55%,#3984ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent">PARA REVENDEDORES</div>
    <div class="abs" id="oTag" style="left:0;right:0;top:1090px;text-align:center;font-size:54px;font-weight:700;color:rgba(246,244,239,.85)">Vendé streaming <b style="color:var(--red)">con tu marca.</b></div>
    <div class="abs" id="oPills" style="left:60px;right:60px;top:1220px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px">
      <span class="pill" style="${pillCss}">Precios de mayorista</span>
      <span class="pill" style="${pillCss}">Entrega al instante</span>
      <span class="pill" style="${pillCss}">Tu propia tienda</span>
      <span class="pill" style="${pillCss}">${emo("🇧🇴 Bolivia")}</span>
    </div>
    <div class="abs" id="oCta" style="left:0;right:0;top:1440px;text-align:center"><span class="pill" style="background:var(--paper);color:#121418;font-size:50px;padding:30px 54px">${emo("💬 Escribinos y empezá hoy")}</span></div>
  </section>`);
  scene(T_OUT, DURATION + 1, s, (lt) => {
    const pm = spring(P(lt, 0, .9));
    set($("#oMark", s), { transform: `scale(${pm}) rotate(${(1 - pm) * 30}deg)` });
    const pw = oExpo(P(lt, .15, .6));
    set($("#oWord", s), { opacity: pw, transform: `translateY(${(1 - pw) * 80}px)`, letterSpacing: `${-.05 + (1 - pw) * .2}em` });
    const ps = oExpo(P(lt, .5, .6));
    set($("#oSoon", s), { opacity: ps, transform: `scale(${1.3 - .3 * ps})`, backgroundPosition: `${(lt * 40) % 300}% 0` });
    const pt = oExpo(P(lt, 1.0, .5));
    set($("#oTag", s), { opacity: pt, transform: `translateY(${(1 - pt) * 30}px)` });
    [...$("#oPills", s).children].forEach((c, i) => { const p = oBack(P(lt, 1.5 + i * .12, .4), 2); set(c, { opacity: clamp(p * 2), transform: `scale(${p})` }); });
    const pc = spring(P(lt, 2.2, .7));
    const pulse = 1 + .03 * Math.max(0, Math.sin((lt - 2.2) * Math.PI * 2 / BEAT / 2)) * clamp(lt - 2.9);
    set($("#oCta", s), { opacity: clamp(pc * 2), transform: `translateY(${(1 - pc) * 60}px) scale(${(.6 + .4 * pc) * pulse})` });
  });
}

// ------------------------------------------------------------------ fondo, cámara y transiciones
const grain = $("#grain"), gctx = grain.getContext("2d");
const noiseTiles = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d"), d = x.createImageData(256, 256);
  let sd = 1234 + k * 99;
  for (let i = 0; i < d.data.length; i += 4) { sd = (sd * 16807) % 2147483647; const v = sd % 256; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); noiseTiles.push(c);
}
function drawGrain(frame) {
  const tile = noiseTiles[frame % noiseTiles.length];
  gctx.fillStyle = gctx.createPattern(tile, "repeat");
  gctx.save(); gctx.translate((frame * 37) % 256, (frame * 91) % 256); gctx.fillRect(-256, -256, 1080 + 512, 1920 + 512); gctx.restore();
}
const CUTS = [T_LOGO, T_FEAT, T_MONT, T_OUT];   // cortes con barrido
function seek(t) {
  for (const r of registry) {
    const on = t >= r.start && t < r.end;
    r.el.style.display = on ? "block" : "none";
    if (on) r.update(t - r.start, t);
  }
  // fondo vivo
  set($("#glowA"), { left: `${-500 + Math.sin(t * .35) * 160}px`, top: `${-450 + Math.cos(t * .3) * 120}px` });
  set($("#glowB"), { left: `${100 + Math.cos(t * .28) * 180}px`, top: `${900 + Math.sin(t * .33) * 160}px` });
  set($("#stripes"), { backgroundPosition: `${(t * 60) % 260}px 0` });
  // golpe en cada negra durante el drop + temblor en los cortes
  let bump = 0;
  if (t >= T_FEAT && t < T_OUT) { const bt = (t - T_FEAT) % BEAT; bump = .012 * Math.exp(-bt * 12); }
  let shake = 0;
  for (const c of CUTS) { const d = t - c; if (d >= 0 && d < .35) shake = Math.max(shake, (1 - d / .35)); }
  set($("#cam"), { transform: `translate(${Math.sin(t * 90) * 10 * shake}px, ${Math.cos(t * 77) * 10 * shake}px) scale(${1 + bump})` });
  // barrido con franjas
  const wipe = $("#wipe"); let wp = -1;
  for (const c of CUTS) if (t >= c - .26 && t < c + .26) wp = (t - (c - .26)) / .52;
  if (wp >= 0) { set(wipe, { display: "block", transform: `translateX(${lerp(-2700, 1500, ioCubic(wp))}px) skewX(-20deg)` }); } else wipe.style.display = "none";
  // destello blanco
  let fl = 0; for (const c of CUTS) { const d = t - c; if (d >= 0 && d < .3) fl = Math.max(fl, .55 * (1 - d / .3)); }
  $("#flash").style.opacity = fl;
  // subtítulos: la frase activa, con las palabras ya dichas en blanco y la actual en azul
  const cap = (window.CAPS || []).find((c) => t >= c.a && t < c.b), capEl = $("#cap");
  const key = cap ? cap.a + ":" + cap.words.filter((w) => w[1] <= t).length : "";
  if (capEl.dataset.k !== key) {
    capEl.dataset.k = key;
    if (!cap) capEl.innerHTML = "";
    else {
      const said = cap.words.filter((w) => w[1] <= t).length;
      capEl.innerHTML = `<span class="box">${cap.words.map((w, i) => i < said ? `<b class="${i === said - 1 ? "now" : ""}">${w[0]}</b>` : w[0]).join(" ")}</span>`;
    }
  }
  if (cap) { const p = oExpo(P(t, cap.a, .18)); set(capEl, { opacity: p, transform: `translateY(${(1 - p) * 20}px)` }); }
  $("#vignette").style.opacity = t >= T_MONT && t < T_OUT ? .35 : 1;
  drawGrain(Math.round(t * 30));
}
window.seek = seek;

// listo cuando cargan imágenes y fuentes
window.READY = (async () => {
  await document.fonts.load('900 100px "Inter Display"'); await document.fonts.load('800 100px "Inter Display"'); await document.fonts.load('100px "Noto Color Emoji"');
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => console.warn("img", i.src))));
  // la barra de arriba de cada captura mide distinto (tienda vs. visitante): el contenido arranca justo debajo
  for (const top of document.querySelectorAll(".screen img.top")) {
    const bw = top.parentElement.querySelector(".bw");
    if (bw) bw.style.top = `${62 + top.naturalHeight * SC}px`;
  }
  seek(0);
  return true;
})();
if (location.search.includes("play")) { window.READY.then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }); }
</script>
